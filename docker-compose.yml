services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     nuthatch
      POSTGRES_PASSWORD: nuthatch
      POSTGRES_DB:       nuthatch_gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuthatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  nuthatch-gateway:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_CONFIG: /app/config.toml
      RUST_LOG:       nuthatch_gateway=info,horizon_core=info
      NUTHATCH_NID:   ${NUTHATCH_NID:?set NUTHATCH_NID in .env}
      NUTHATCH_QUERY_MODE: ${NUTHATCH_QUERY_MODE:-NAMED}
    volumes:
      - ./gateway.toml:/app/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Caddy on the host is the only public entry point.
      - "127.0.0.1:8090:8090"

volumes:
  pgdata:
